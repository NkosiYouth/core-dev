name: Deploy Odoo Custom Modules

on:
  push:
    branches:
      - dev  # Runs when changes are pushed to the 'dev' branch

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Debug Directory Structure
      run: ls -lah  # Debug to check if custom_addons exists

    - name: Ensure custom_addons exists locally
      run: mkdir -p custom_addons  # Ensure directory exists to prevent errors

    - name: Setup SSH and Deploy
      env:
        PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        HOST: 3.70.128.12  # Replace with your actual EC2 public IP
        USER: ubuntu
      run: |
        # Save the private key
        echo "$PRIVATE_KEY" > private_key.pem
        chmod 600 private_key.pem
        
        # Create SSH folder and known_hosts file to prevent host authenticity prompts
        mkdir -p ~/.ssh
        ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
        
        # Ensure the target directory exists on the EC2 instance
        ssh -i private_key.pem $USER@$HOST "sudo mkdir -p /opt/custom_addons && sudo chown -R odoo:odoo /opt/custom_addons"
        
        # Debugging: List files before transferring
        echo "Checking if custom_addons exists:"
        ls -lah custom_addons || echo "custom_addons directory is missing!"

        # Transfer custom modules to the correct path in EC2
        if [ -d "custom_addons" ]; then
          scp -i private_key.pem -r custom_addons/* $USER@$HOST:/opt/custom_addons
        else
          echo "custom_addons directory does not exist! Exiting..."
          exit 1
        fi

        # Set the correct permissions after transfer
        ssh -i private_key.pem $USER@$HOST "sudo chown -R odoo:odoo /opt/custom_addons"
        
        # Restart Odoo service
        ssh -i private_key.pem $USER@$HOST "sudo systemctl restart odoo"
